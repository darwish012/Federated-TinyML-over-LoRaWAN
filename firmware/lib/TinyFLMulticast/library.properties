name=TinyFLMulticast
version=1.0.0
author=Abdelrahman Darwish, Tallal Elshabrawy
maintainer=Abdelrahman Darwish
sentence=LoRaWAN Class C multicast reception alongside MCCI LMIC, with no changes to that library.
paragraph=MCCI LMIC 6.0.1 has no multicast session support and drops any downlink whose DevAddr is not the device's own. This companion library hooks the documented LMICOS_logEventUint32 seam that LMIC calls at exactly that drop point, verifies the frame against a separately provisioned multicast session, decrypts it with LMIC's own AES engine, and hands the payload to the sketch. The stock library stays byte-for-byte unmodified.
category=Communication
architectures=*
depends=MCCI LoRaWAN LMIC library
